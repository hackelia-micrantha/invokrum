[package]
name = "invokrum-schema"
description = "Strict YAML and JSON adapters for Invokrum overlay packs"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
invokrum-core = { path = "../invokrum-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[dev-dependencies]
jsonschema = { version = "0.49.2", default-features = false }

[lints]
workspace = true
