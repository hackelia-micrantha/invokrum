name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting and linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  architecture:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check dependency direction
        run: python3 scripts/check_architecture.py
      - name: Test threat-model contract checker
        run: python3 -m unittest tests/test_threat_model_contract.py
      - name: Check threat-model contract
        run: python3 scripts/check_threat_model.py

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Run unit tests
        run: cargo test --workspace --lib --all-features --locked

  core-integration:
    name: Core integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Run core integration tests
        run: cargo test -p invokrum-core --tests --all-features --locked

  filesystem-integration:
    name: Filesystem integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Run fail-closed filesystem tests
        run: cargo test -p invokrum-fs --tests --all-features --locked

  integrity-integration:
    name: Integrity integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Run lockfile and drift tests
        run: cargo test -p invokrum-integrity --tests --all-features --locked

  schema-integration:
    name: Schema integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install pinned schema validator
        run: |
          python3 -m venv .ci-schema
          .ci-schema/bin/pip install --disable-pip-version-check -r .github/requirements-schema.txt
      - name: Validate schema metaschema
        run: .ci-schema/bin/check-jsonschema --check-metaschema schemas/invokrum-pack-v1.schema.json
      - name: Validate reference fixtures against schema
        run: |
          .ci-schema/bin/check-jsonschema \
            --schemafile schemas/invokrum-pack-v1.schema.json \
            tests/fixtures/schema/minimal-pack.json \
            tests/fixtures/schema/minimal-pack.yaml
      - name: Run schema adapter integration tests
        run: cargo test -p invokrum-schema --test integration --all-features --locked

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Run CLI end-to-end tests
        run: cargo test -p invokrum-cli --test e2e --all-features --locked
