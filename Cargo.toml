[workspace]
members = [
  "crates/invokrum-core",
  "crates/invokrum-schema",
  "crates/invokrum-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/hackelia-micrantha/invokrum"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
